<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects Data Structure and Array</title>
</head>

<body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
        var student = {
            name: 'Avipsha',
            age: '14',
            Grade: '8',
            hobbies: 'Music',
            fav_sport: 'Football'
        };
        var color = ["white", "black", "red", "green", "blue"];
        document.write("Student name is : " + student.name,
            "<br>", "Student favorite sport is : "
        + student.fav_sport);
        document.write("<br>Before Poping the colors are: " + color.join("^"));
        document.write("<br>My favorite color is : " + color[0]);
        color.pop();
        document.write("<br>After Poping the colors are : " + color.join("*"));
    </script>
</body>

</html>
