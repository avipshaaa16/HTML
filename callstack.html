<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call stack in Javascript</title>
</head>

<body>
    <center>
        <h1>Call stack in Javascript</h1>
        <p id="demo"></p>
        <script>
            function add(a, b) {
                return a + b;
            }
            function average(a, b) {
                return add(a, b) / 2;
            }
            var result = average(30, 70);
            document.getElementById("demo").innerHTML = result;
        </script>
    </center>
</body>

</html>
