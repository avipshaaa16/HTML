<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String method</title>
</head>

<body>
    <h2>String Method</h2>
    <p>Convert number to String</p>
    <p id="string_result"></p>
    <p id="number_result"></p>
    <script>
        var a = 20;
        var b = 30;
        document.getElementById("string_result").innerHTML = String(a) + String(b);
        document.getElementById("number_result").innerHTML = a + b;
    </script>
</body>

</html>
