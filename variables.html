<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>

<body>
    <h1>
        Javascript Variables
    </h1>
    <p>Sum of two numbers</p>
    <p id="result"></p>
    <script>
        var num1 = 16
        var num2 = 19
        var sum = num1 + num2
        // My heading
        document.getElementById("result").innerHTML = "Result=" + sum;
    </script>
</body>

</html>
