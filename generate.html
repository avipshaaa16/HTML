<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate random number</title>
</head>

<body>
    <h1>Generate random number</h1>
    <p id="result"></p>
    <script>
        var text = "";
        var i = 0;
        while (i < 10) {
            text += "<br> The number is" + i;
            i++;
        }
        document.getElementById("result").innerHTML = text;
    </script>
</body>

</html>
