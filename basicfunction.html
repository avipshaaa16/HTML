<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>

<body>
    <h1>Creating basic function in JavaScript</h1>
    <button onclick="myfunction(8)">Click me!!!!!</button>
    <script>
        function myfunction(a, b) {
            if (b === undefined) {
                b = 4;
            }
            document.write(a * b);
        }
    </script>
</body>

</html>
