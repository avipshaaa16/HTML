<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statements</title>
</head>

<body>
    <h1 id="myH"></h1>
    <p id="myP"></p>
    <p id="result"></p>
    <script>
        var x, y, z, u;
        x = parseInt(prompt("enter the first number"));
        y = parseInt(prompt("enter the second number"));
        z = parseInt(prompt("enter the third number"));

        u = x + y + z;
        // My Result
        document.getElementById("result").innerHTML = "Result of " + x + y + z + "=" + u;
        // My heading
        document.getElementById("myH").innerHTML = "Javascript Statements";
        // My paragraph
        document.getElementById("myP").innerHTML = "Javascript program is a list of statements to be executed by a computer";


    </script>
</body>

</html>
