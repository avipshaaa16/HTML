<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
</head>
<style>
.slider{
    width:300px ;
    height:200px ;
    overflow: hidden;
}
.slider img{
      width: 300px;
      height: 200px;
}
</style>
<body>
    <h2>Food img Slider</h2>
   <div class="slider">
    <img src="momo.png" alt="momo">
    <img src="pizza.jpg" alt="pizza">
    <img src="roll.jpg" alt="roll">
    <img src="burger.webp" alt="burger">
    <img src="chowmein.jpg" alt="chowmein">
   </div>
</body>

</html>
