<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validation in js</title>
</head>
<body>
    <h2>Form Validation</h2>
    <form name="myForm" onsubmit="return validate()"><input name="name"><button type="submit">Submit</button></form>
    <script>
     function validate(){
        var x = document.forms["myForm"] ["name"].value;
        if (x=="") {
            alert("Name must be filled.");
            return false
        } else {
            alert("Form submitted");
        }
     }
    </script>
    
</body>
</html>
