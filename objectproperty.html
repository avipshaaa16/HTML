<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript object and it's properties</title>
</head>

<body>
    <center>
        <h1>Javascript objects and it's properties</h1>
        <p>Two ways to access object properties</p>
        <p>You can use .propertyname or ["propertyname"]</p>
        <p id="demo"></p>
        <script>
            var details = { name: "Avipsha", age: 13, grade: 8 };
            document.getElementById("demo").innerHTML = "hello I am" + details.name + "and I am" + details.age + "and I study in" + details.grade + "grade";



        </script>
    </center>
</body>

</html>
