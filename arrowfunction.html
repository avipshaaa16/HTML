<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function in JS</title>
</head>

<body>
    <h2>Arrow function in JS</h2>
    <p id="result"></p>
    <script>
        const add = (a, b) => a + b;
        document.getElementById("result").innerHTML = add(17, 19);
    </script>
</body>

</html>
