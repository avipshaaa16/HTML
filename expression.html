<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Function declaration</title>
</head>

<body>
    <center>
        <h1>Declarataion of expression function</h1>
        <script>
            var m = function (a, b) {
                return a - b;
            };
            document.write(m(6, 3));
        </script>
    </center>
</body>

</html>
