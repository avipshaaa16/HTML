<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Counter App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #value {
            font-size: 48px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h2>Counter App</h2>
    <div id="value">0</div>
    <button id="button-increment">Increase</button>
    <button id="button-decrement">Decrease</button>
    <button id="button-reset">Reset</button>

    <script>
        var value = 0;

        var button_increment = document.getElementById('button-increment');
        var button_decrement = document.getElementById('button-decrement');
        var button_reset = document.getElementById('button-reset');
        var display = document.getElementById('value');

        button_increment.onclick = function () {
            value++;
            display.textContent = value;
        };

        button_decrement.onclick = function () {
            value--;
            display.textContent = value;
        };

        button_reset.onclick = function () {
            value = 0;
            display.textContent = value;
        };
    </script>
</body>

</html>
