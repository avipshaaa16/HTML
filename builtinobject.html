<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript math object</title>
</head>

<body>
    <center>
        <h1>Javascript math object</h1>

        <script type="text/javascript">
            var value = Math.abs(10);
            document.write("test value" + value + "<br>")
            var value = Math.acos(-1);
            document.write("test value" + value + "<br>")
            var value = Math.asin(1);
            document.write("test value" + value + "<br>")
            var value = Math.atan(.5);
            document.write("test value" + value + "<br>")
        </script>
    </center>
</body>

</html>
