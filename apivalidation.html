<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api validation</title>
</head>

<body>
    <h2>Api Validation</h2>
    <p>Enter a number and click OK</p>
    <input id="number" type="number" min="100" max="300" required>
    <button onclick="myfunction()">OK</button>
    <p>If the number is less than 100 or greater than 300 , an error message will be displayed.</p>
    <p id="result"></p>
    <script>
        function myfunction() {
            var a = document.getElementById("number");
            if (!a.checkValidity()) {
                document.getElementById("result").innerHTML = a.validationMessage;
            } else {
                document.getElementById("result").innerHTML = "input validated";
            }
        }
    </script>
</body>

</html>
