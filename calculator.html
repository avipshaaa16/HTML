<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<style>
    .calculator {
        background-color: rgb(96, 90, 90);
        display: flex;
        justify-content: space-evenly;
        flex-direction: column;
        align-items: center;
        color: white;
        gap: 20px;
        padding: 5px;
        border-radius: 5px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    #result {
        grid-column: 1/span 3;

    }
</style>

<body>
    <div class="calculator">
        <div class="title">Calculator</div>
        <div class="grid">
            <input id="result" type="text" placeholder="result" readonly>
            <button class="btn op" onclick="setscreenvalue('+')">+</button>
            <!-- row 1 -->
            <button class="btn" onclick="setscreenvalue('1')">1</button>
            <button class="btn" onclick="setscreenvalue('2')">2</button>
            <button class="btn" onclick="setscreenvalue('3')">3</button>
            <button class="btn op" onclick="setscreenvalue('-')">-</button>
            <!-- row 2 -->
            <button class="btn" onclick="setscreenvalue('4')">4</button>
            <button class="btn" onclick="setscreenvalue('5')">5</button>
            <button class="btn" onclick="setscreenvalue('6')">6</button>
            <button class="btn op" onclick="setscreenvalue('*')">*</button>
            <!-- row 3 -->
            <button class="btn" onclick="setscreenvalue('7')">7</button>
            <button class="btn" onclick="setscreenvalue('8')">8</button>
            <button class="btn" onclick="setscreenvalue('9')">9</button>
            <button class="btn op" onclick="setscreenvalue('/')">/</button>
            <!-- row 4 -->
            <button class="btn" onclick="setscreenvalue('%')">%</button>
            <button class="btn" onclick="setscreenvalue('0')">0</button>
            <button class="btn" onclick="setscreenvalue('.')">.</button>
            <button class="btn op" onclick="calculate()">=</button>
        </div>
        <button class="clear" onclick="clearscreen()">Clear</button>
    </div>
    <script>
        function clearscreen() {
            document.getElementById('result').value = "";
        }
        function setscreenvalue(value) {
            const r = document.getElementById("result");
            if (r.value === "Enter an expression" || r.value === "Invalid expression")
                r.value = "";
            r.value += value;
        }

        function calculate() {
            const result = document.getElementById("result");
            const expression = result.value.trim();
            if (expression === "") {
                result.value = "Enter an expression";
                return;
            }
            try {
                result.value = eval(expression)
            } catch (error) {
                result.value = "Invalid expression";
            }
        }

    </script>
</body>

</html>
