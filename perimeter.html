<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perimeter Calculation using JS</title>
</head>

<body>
    <h1>Perimeter Calculation using JS</h1>
    <p id="result"></p>
    <p id="demo"></p>
    <script>
        var choice = prompt("1.Perimeter of rectangle\n 2.Perimeter of square\n 3.Perimeter of triangle\n 4.Perimeter of circle ");
        if (choice == "1") {
            var l = prompt("Enter the length");
            var b = prompt("Enter the breadth");
            var result = 2 * Number(l) + Number(b);
            document.write("The value of l is" + l + "the value of b is" + b);
            document.getElementById("result").innerHTML = "The area of a rectangle is" + result;

        } else if (choice == "2") {
            var s = prompt("Enter the side");
            var result = 4 * Number(s);
            document.getElementById("result").innerHTML = "The area of square is" + result;
        } else if (choice == "3") {
            var s = prompt("Enter the side");
            var a = prompt("Enter other side");
            var v = prompt("Enter another side");
            var result = Number(s) + Number(a) + Number(v);
            document.getElementById("result").innerHTML = "The perimeter of triangle is" + result;
        } else if (choice == "4") {
            var r = prompt("Enter the radius");
            var result = 2 * 3.14 * r;
            document.getElementById("result").innerHTML = "The perimeter of circle is" + result;
        } else {
            document.getElementById("result").innerHTML = "invalid choice";
        }

    </script>
</body>

</html>
