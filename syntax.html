<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax guide and commenting</title>
</head>

<body>
    <h1 id="myH"></h1>
    <p id="myP"></p>
    <script>
        // My heading
        document.getElementById("myH").innerHTML = "Javascript Heading";
        // My paragraph
        document.getElementById("myP").innerHTML = "Javascript Paragraph";

    </script>
</body>

</html>
