<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods in array Javascript</title>
</head>

<body>
    <center>
        <h1>Methods in array in Javascript</h1>
        <p id="demo"></p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var details = ["Avipsha", "13", "8"];
            document.getElementById("demo").innerHTML = details;
            document.getElementById("myjoin").innerHTML = details.join(" - ");
            document.getElementById("myfirstpop").innerHTML = details.pop();
            document.getElementById("mysecondpop").innerHTML = details;


        </script>
    </center>
</body>

</html>
